<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — OYA</title>
  <style>
    :root {
      --oya-primary: #0B3D91;
      --oya-bg: #F5F7FA;
      --oya-bg-white: #FFFFFF;
      --oya-text-primary: #0F172A;
      --oya-text-secondary: #475569;
      --oya-border: #E2E8F0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--oya-bg);
      color: var(--oya-text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .error-card {
      background: var(--oya-bg-white);
      border: 1px solid var(--oya-border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
    }
    .error-logo { width: 56px; height: 56px; margin: 0 auto 1.25rem; border-radius: 12px; background: var(--oya-primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.8125rem; letter-spacing: 0.5px; }
    .error-code {
      font-size: 3.5rem;
      font-weight: 800;
      color: var(--oya-primary);
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    .error-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; }
    .error-message { font-size: 0.9375rem; color: var(--oya-text-secondary); margin-bottom: 1.75rem; line-height: 1.5; }
    .error-actions { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.65rem 1.25rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: 1.5px solid var(--oya-border);
    }
    .btn-primary { background: var(--oya-primary); color: #fff; border-color: var(--oya-primary); }
    .btn-secondary { background: transparent; color: var(--oya-text-primary); }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-logo">OYA</div>
    <div class="error-code">404</div>
    <div class="error-title">Page Not Found</div>
    <p class="error-message">
      The page you're looking for doesn't exist, may have been moved, or the link may be incorrect.
    </p>
    <div class="error-actions">
      <a href="/" class="btn btn-primary">Go to Dashboard</a>
      <a href="javascript:history.back()" class="btn btn-secondary">Go Back</a>
    </div>
  </div>
</body>
</html>
