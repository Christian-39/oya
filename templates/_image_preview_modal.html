<!-- Image Preview Modal -->
<div id="imagePreviewModal" class="modal" style="display:none;position:fixed;inset:0;z-index:9999;flex-direction:column;align-items:center;justify-content:center;padding:4rem 1rem 1rem;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);" onclick="closeImagePreview(event)">
  
  <!-- Close button - fixed to viewport so it's always visible -->
  <button 
    onclick="event.stopPropagation(); closeImagePreview();" 
    style="position:fixed;top:1rem;right:1rem;z-index:10000;background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.2);color:#fff;cursor:pointer;padding:0.6rem;border-radius:50%;transition:all 0.2s ease;backdrop-filter:blur(4px);"
    onmouseover="this.style.background='rgba(255,255,255,0.15)';this.style.borderColor='rgba(255,255,255,0.4)';"
    onmouseout="this.style.background='rgba(0,0,0,0.6)';this.style.borderColor='rgba(255,255,255,0.2)';"
    aria-label="Close preview"
  >
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"/>
      <line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </button>

  <!-- Image container -->
  <div style="position:relative;max-width:90vw;max-height:calc(90vh - 3rem);display:flex;flex-direction:column;align-items:center;gap:0.75rem;" onclick="event.stopPropagation()">
    <!-- Image -->
    <img id="previewImage" src="" alt="" style="max-width:100%;max-height:calc(85vh - 3rem);object-fit:contain;border-radius:12px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);">
    <!-- Caption -->
    <div id="previewCaption" style="color:#fff;font-size:0.95rem;font-weight:500;text-align:center;padding:0.5rem 1.25rem;background:rgba(0,0,0,0.5);border-radius:8px;max-width:100%;word-break:break-word;"></div>
  </div>
</div>

<script>
// Image Preview Functions
function openImagePreview(imageUrl, caption) {
  const modal = document.getElementById('imagePreviewModal');
  const img = document.getElementById('previewImage');
  const cap = document.getElementById('previewCaption');

  if (!imageUrl) {
    cap.textContent = (caption || 'No image') + ' - No photo available';
    img.style.display = 'none';
  } else {
    img.src = imageUrl;
    img.style.display = 'block';
    cap.textContent = caption || 'Image Preview';
  }

  modal.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeImagePreview(event) {
  // If triggered by click, only close when clicking the overlay background
  if (event && event.target !== event.currentTarget) return;

  const modal = document.getElementById('imagePreviewModal');
  modal.style.display = 'none';
  document.body.style.overflow = '';

  // Clear image to free memory
  const img = document.getElementById('previewImage');
  img.src = '';
}

// Keyboard support - Escape to close
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    const modal = document.getElementById('imagePreviewModal');
    if (modal && modal.style.display === 'flex') {
      closeImagePreview();
    }
  }
});
</script>
